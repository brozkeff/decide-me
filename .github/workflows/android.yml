name: Android
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Set fork version
        run: |
          echo "APP_VERSION=0.1.0-brozkeff.${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: Test and build installable debug APK
        run: tools/build-android.sh
      - name: Build release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        run: ./gradlew assembleRelease --console=plain --max-workers=4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decide-me-brozkeff-${{ github.sha }}-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Sign and prepare release
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing secret: $name. Debug APK is available in artifacts."; exit 1; fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          mkdir release
          apk="release/decide-me-${APP_VERSION}.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$apk" android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
          node tools/build-manifest.mjs > release/build-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: signed-release
          path: release/
  publish:
    if: github.event_name != 'pull_request' && github.repository == 'brozkeff/decide-me'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download signed release artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-release --dir release
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.0-brozkeff.${GITHUB_SHA:0:7}"
          gh release create "v$version" release/* --target "$GITHUB_SHA" --title "decide me $version" --prerelease --notes "Experimental offline SmolVLM → Laya build. Install the APK, select a model, and download its weights once. Camera frames stay on the device. Generated descriptions and suggestions may be wrong; probabilities are model preferences. Physical-device quality and latency require measurement."
